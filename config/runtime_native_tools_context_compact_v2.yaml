# Context-safe native runtime with deterministic retrieval-history compaction.
runtime_version: "3"
max_tool_requests_per_node: 16
page_size: 5
excerpt_chars: 400
tool_protocol: native-v2
search_ranker_version: human-lexical-v2
validator_version: validator_v3
verification_mode: audit_only
prompt_version: v5
scorer_version: "2"
feedback_rounds: 0
tool_turn_max_output_tokens: 8192
final_max_output_tokens: 16384
repair_max_output_tokens: 4096
context_compaction_version: retrieval-ledger-v1
context_compaction_trigger_tokens: 18000
context_compaction_target_tokens: 12000
search_disable_after_no_new: 3
reject_duplicate_searches: true
