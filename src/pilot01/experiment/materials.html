<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilot01 · 实验材料</title>
<style>
:root{--ink:#172735;--muted:#74828f;--line:#e2e8ec;--green:#138b72}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:18px 32px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}a{color:#4075cf;text-decoration:none}nav{display:flex;gap:10px}nav a{padding:7px 12px;border-radius:8px}nav a[aria-current]{background:#edf5f2;color:#276f5b}.brand{font-size:19px;font-weight:750}main{max-width:1440px;margin:auto;padding:28px 30px}h1{font-size:28px;margin:0}p{color:var(--muted);margin:6px 0 20px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;margin-top:22px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}label{font-size:12px;display:block;font-weight:600;margin-bottom:6px}select,input,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:white;color:var(--ink)}select,input{width:100%;margin-bottom:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:hover:enabled{border-color:#83b4a6}.list{max-height:68vh;overflow:auto}.case{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}.case.active{background:#edf7f3;border-color:#9bc7b8}.case b{font:600 13px Consolas,monospace}.case small{display:block;color:var(--muted);font-size:11px}.muted{font-size:12px;color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:start;gap:16px}h2{font-size:20px;margin:0}.tabs{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.claim{padding:16px;border:1px solid var(--line);border-radius:9px;margin:12px 0}.claimHead{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--line);padding:2px 6px;border-radius:4px}.claim p{margin:9px 0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:10px}summary{cursor:pointer;font-size:12px;color:#4075cf}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8fa;padding:13px;border-radius:7px;font:12px/1.8 Consolas,"Microsoft YaHei",monospace;max-height:65vh;overflow:auto}.notice{background:#edf7f3;color:#286b59;padding:12px 16px;border-radius:9px;font-size:12px}.error{color:#a6404c;white-space:pre-wrap}.hash{font:10px/1.6 Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.empty{padding:45px 15px;text-align:center;color:var(--muted)}.counter{font-size:12px;color:var(--muted);margin-bottom:10px}#content{min-height:300px}@media(max-width:800px){header{padding:15px}main{padding:20px 14px}.layout{grid-template-columns:minmax(0,1fr)}.list{max-height:230px}.panel{padding:16px}.top{flex-wrap:wrap}h1{font-size:24px}}
</style></head><body>
<header><a href="/" class="brand">pilot01</a><nav aria-label="网站导航"><a href="/office" style="padding:8px 12px;color:#526579;text-decoration:none">像素办公室</a><a href="/">实验台</a><a href="/records">实验记录</a><a href="/materials" aria-current="page">实验材料</a></nav><span class="muted">冻结输入 · 只读预览</span></header>
<main><h1>实验材料</h1><p>逐份查看旧40份、新40份的合同原文与 E0 / E1 memo。</p><div class="notice">预览不调用模型，也不会把额外信息送给实验 Agent。材料已由 AI 审核冻结，人工复核尚未完成。</div>
<div class="layout"><aside class="panel"><label for="cohort">材料范围</label><select id="cohort"><option value="all80">全部80份</option><option value="old40">旧40份</option><option value="new40">新40份</option></select><label for="query">搜索合同编号</label><input id="query" placeholder="例如 CASE-0017"><div id="count" class="counter">读取中…</div><div id="cases" class="list"></div></aside>
<section class="panel"><div class="top"><div><h2 id="caseTitle">选择一份合同</h2><div id="caseMeta" class="muted"></div></div><a href="/" id="back">返回实验台选择条件 ↗</a></div><div class="tabs"><button class="tab active" data-view="E0">E0 · 完整摘要</button><button class="tab" data-view="E1">E1 · 遗漏摘要</button><button class="tab" data-view="contract">合同原文</button></div><div id="content" class="empty">正在读取冻结材料…</div><div id="hash" class="hash"></div></section></div></main>
